name: "publish"

on:
  push:
    branches:
      - main

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install frontend dependencies
        run: npm install

      - name: ensure logo exists (with fallback)
        run: |
          mkdir -p public
          if [ ! -f public/logo.png ] || [ $(stat -c%s "public/logo.png") -lt 100 ]; then
            curl -L https://raw.githubusercontent.com/tauri-apps/tauri/dev/app-icon.png -o public/logo.png
          fi
        shell: bash

      - name: generate icons on-the-fly
        run: npx tauri icon public/logo.png --out src-tauri/icons

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        with:
          tagName: v__VERSION__ # tauri-action replaces this with the app version
          releaseName: "Tú Anh Xinh Gái v__VERSION__"
          releaseBody: "Bản cài đặt Desktop chính thức cho Tú Anh Xinh Gái. Tải tệp .msi hoặc .exe bên dưới."
          releaseDraft: true
          prerelease: false
